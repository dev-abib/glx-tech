create-appointment:
  post:
    tags: ["19 — Appointments"]
    summary: Create a new appointment (Buyer)
    description: Books a time slot on a listing. The booking time is locked — no two non-cancelled appointments can exist for the same listing + time slot.
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/CreateServiceAppointmentInput"
              - $ref: "#/components/schemas/CreateRentAppointmentInput"
            discriminator:
              propertyName: appointmentType
              mapping:
                SERVICE: "#/components/schemas/CreateServiceAppointmentInput"
                RENT: "#/components/schemas/CreateRentAppointmentInput"
          examples:
            service-booking:
              summary: Service Booking (date + time slot)
              description: For SERVICE appointments — send date + a required bookingTime slot + fixed price. No duration fields needed.
              value:
                listingId: clz6xq8k80001hxq8f1j2m3n5
                bookingDate: "2026-07-15"
                bookingTime: "10:00"
                appointmentType: SERVICE
                price: 150.00
            rent-booking:
              summary: Rent Booking (duration-based)
              description: For RENT appointments — send date + duration + hourly/daily price. No price field needed.
              value:
                listingId: clz6xq8k80001hxq8f1j2m3n5
                bookingDate: "2026-07-15"
                appointmentType: RENT
                hourlyPrice: 25.00
                duration: 3
                durationUnit: hours
    responses:
      "201":
        description: Appointment created successfully
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/ApiResponse"
                - properties:
                    data:
                      $ref: "#/components/schemas/Appointment"
      "400":
        description: Invalid input or listing unavailable
      "401":
        description: Unauthorized
      "404":
        description: Listing not found
      "409":
        description: Time slot or date already booked

