seller-get-dashboard-stats:
  get:
    tags: ["19 — Appointments"]
    summary: Get seller dashboard stats
    description: Returns seller dashboard statistics — average rating from listing reviews, response rate (confirmed/total), and current week completed jobs.
    security:
      - bearerAuth: []
    responses:
      "200":
        description: Dashboard stats fetched successfully
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/ApiResponse"
                - properties:
                    data:
                      type: object
                      properties:
                        averageRating:
                          type: number
                          example: 4.5
                          description: Average rating from all listing reviews
                        responseRate:
                          type: number
                          example: 85.0
                          description: Response rate percentage (confirmed / total non-cancelled)
                        currentWeekCompleted:
                          type: integer
                          example: 5
                          description: Total completed jobs
                        totalListings:
                          type: integer
                          example: 3
                          description: Total number of listings
                        totalAppointments:
                          type: integer
                          example: 12
                          description: Total non-cancelled appointments
      "401":
        description: Unauthorized

cancel-my-booking:
  patch:
    tags: ["19 — Appointments"]
    summary: Cancel my booking (Buyer)
    description: Cancel one of the authenticated buyer's own bookings. Only works for pending or confirmed appointments — cannot cancel already completed or already cancelled ones.
    security:
      - bearerAuth: []
    parameters:
      - name: appointmentId
        in: path
        required: true
        schema:
          type: string
        description: Appointment ID to cancel
    responses:
      "200":
        description: Booking cancelled successfully
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/ApiResponse"
                - properties:
                    data:
                      $ref: "#/components/schemas/Appointment"
      "400":
        description: Cannot cancel — already completed or already cancelled
      "401":
        description: Unauthorized
      "403":
        description: Forbidden — Not your booking to cancel
      "404":
        description: Appointment not found

update-appointment-status:
  patch:
    tags: ["19 — Appointments"]
    summary: Update appointment status
    description: |
      Update the status of an appointment.
      - **Seller** can confirm or complete
      - **Buyer or Seller** can cancel
    security:
      - bearerAuth: []
    parameters:
      - name: appointmentId
        in: path
        required: true
        schema:
          type: string
        description: Appointment ID
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UpdateAppointmentStatusInput"
    responses:
      "200":
        description: Appointment status updated successfully
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/ApiResponse"
                - properties:
                    data:
                      $ref: "#/components/schemas/Appointment"
      "400":
        description: Invalid status transition
      "401":
        description: Unauthorized
      "403":
        description: Forbidden — Not authorized to update this appointment
      "404":
        description: Appointment not found
