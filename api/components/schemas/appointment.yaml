Appointment:
  type: object
  properties:
    id:
      type: string
      format: cuid
      example: clz6xq8k80000hxq8f1j2m3n4
      description: Unique appointment identifier (auto-generated CUID)
    listingId:
      type: string
      format: cuid
      example: clz6xq8k80001hxq8f1j2m3n5
      description: ID of the listing being booked
    buyerId:
      type: string
      format: cuid
      example: clz6xq8k80002hxq8f1j2m3n6
      description: ID of the buyer who made the booking
    sellerId:
      type: string
      format: cuid
      example: clz6xq8k80003hxq8f1j2m3n7
      description: ID of the seller (listing owner)
    bookingDate:
      type: string
      format: date
      example: "2026-07-15"
      pattern: "^\\d{4}-\\d{2}-\\d{2}$"
      description: The booking date in YYYY-MM-DD format
    bookingTime:
      type: string
      format: time
      nullable: true
      example: "09:00"
      pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
      description: The selected time slot (HH:MM, 24-hour format). Nullable — not required for service appointments (whole-day booking).
    status:
      type: string
      enum: [pending, confirmed, cancelled, completed]
      example: pending
      description: Current appointment status
    appointmentType:
      type: string
      enum: [SERVICE, RENT]
      example: SERVICE
      description: Type of appointment - SERVICE (fixed price + time slot) or RENT (hourly/daily pricing + duration)
    price:
      type: number
      format: float
      nullable: true
      example: 150.00
      description: Fixed price for SERVICE appointments
    hourlyPrice:
      type: number
      format: float
      nullable: true
      example: 25.00
      description: Hourly rate for RENT appointments
    dailyPrice:
      type: number
      format: float
      nullable: true
      example: 150.00
      description: Daily rate for RENT appointments
    duration:
      type: number
      format: float
      nullable: true
      example: 3
      description: Duration for RENT appointments (in hours or days)
    durationUnit:
      type: string
      nullable: true
      example: hours
      description: Unit of duration - "hours" or "days" for RENT appointments
    listing:
      type: object
      description: Brief listing details included in the response
      properties:
        id:
          type: string
          format: cuid
          example: clz6xq8k80001hxq8f1j2m3n5
        title:
          type: string
          example: Professional Web Development
        slug:
          type: string
          example: professional-web-development
        timeSlot:
          type: array
          description: Available time slots for the listing
          items:
            type: string
            pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
            example: "09:00"
          example: ["09:00", "10:00"]
        media:
          type: array
          description: Listing media (images)
          items:
            type: object
            properties:
              url:
                type: string
                format: uri
                example: https://res.cloudinary.com/example/image/upload/v1/listings/abc123.jpg
              publicId:
                type: string
                example: listings/abc123

CreateServiceAppointmentInput:
  type: object
  required:
    - listingId
    - bookingDate
    - appointmentType
    - price
  properties:
    listingId:
      type: string
      format: cuid
      example: clz6xq8k80001hxq8f1j2m3n5
      description: ID of the listing to book
    bookingDate:
      type: string
      format: date
      example: "2026-07-15"
      pattern: "^\\d{4}-\\d{2}-\\d{2}$"
      description: The desired booking date in YYYY-MM-DD format
    bookingTime:
      type: string
      format: time
      nullable: true
      example: "10:00"
      pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
      description: Optional time slot in HH:MM (24-hour) format. Not required for service appointments.
    appointmentType:
      type: string
      enum: [SERVICE]
      example: SERVICE
      description: Must be "SERVICE" for service-type appointments
    price:
      type: number
      format: float
      example: 150.00
      description: Fixed price for the service
  example:
    listingId: clz6xq8k80001hxq8f1j2m3n5
    bookingDate: "2026-07-15"
    appointmentType: SERVICE
    price: 150.00

CreateRentAppointmentInput:
  type: object
  required:
    - listingId
    - bookingDate
    - appointmentType
    - duration
    - durationUnit
  properties:
    listingId:
      type: string
      format: cuid
      example: clz6xq8k80001hxq8f1j2m3n5
      description: ID of the listing to book
    bookingDate:
      type: string
      format: date
      example: "2026-07-15"
      pattern: "^\\d{4}-\\d{2}-\\d{2}$"
      description: The desired booking date in YYYY-MM-DD format
    bookingTime:
      type: string
      format: time
      example: "10:00"
      pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
      description: The desired time slot in HH:MM (24-hour) format (optional for rent)
    appointmentType:
      type: string
      enum: [RENT]
      example: RENT
      description: Must be "RENT" for rent-type appointments
    hourlyPrice:
      type: number
      format: float
      example: 25.00
      description: Hourly rate (optional if dailyPrice is provided)
    dailyPrice:
      type: number
      format: float
      example: 150.00
      description: Daily rate (optional if hourlyPrice is provided)
    duration:
      type: number
      format: float
      example: 3
      description: Duration value (e.g. 3 for 3 hours/days)
    durationUnit:
      type: string
      enum: [hours, days]
      example: hours
      description: Unit of duration - "hours" or "days"
  example:
    listingId: clz6xq8k80001hxq8f1j2m3n5
    bookingDate: "2026-07-15"
    appointmentType: RENT
    hourlyPrice: 25.00
    dailyPrice: 150.00
    duration: 3
    durationUnit: hours

CreateAppointmentInput:
  oneOf:
    - $ref: "#/components/schemas/CreateServiceAppointmentInput"
    - $ref: "#/components/schemas/CreateRentAppointmentInput"
  discriminator:
    propertyName: appointmentType
    mapping:
      SERVICE: "#/components/schemas/CreateServiceAppointmentInput"
      RENT: "#/components/schemas/CreateRentAppointmentInput"

UpdateAppointmentStatusInput:
  type: object
  required:
    - status
  properties:
    status:
      type: string
      enum: [pending, confirmed, cancelled, completed]
      example: confirmed
      description: |
        New status for the appointment.
        - `pending` → `confirmed` (seller only)
        - `confirmed` → `completed` (seller only)
        - `pending` → `cancelled` (buyer or seller)
        - `confirmed` → `cancelled` (buyer or seller)
  example:
    status: confirmed

BookedSlot:
  type: object
  properties:
    bookingDate:
      type: string
      format: date
      example: "2026-07-15"
      pattern: "^\\d{4}-\\d{2}-\\d{2}$"
      description: The date of the booked slot (YYYY-MM-DD)
    bookingTime:
      type: string
      format: time
      nullable: true
      example: "09:00"
      pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
      description: The time of the booked slot (HH:MM, 24-hour format). Null for whole-day bookings.

UnavailableSlot:
  type: object
  properties:
    id:
      type: string
      format: cuid
      example: clz6xq8k80009hxq8f1j2m3n4
      description: Unique blocked-slot identifier
    sellerId:
      type: string
      format: cuid
      example: clz6xq8k80010hxq8f1j2m3n5
      description: ID of the seller who blocked the slot
    date:
      type: string
      format: date
      example: "2026-07-16"
      pattern: "^\\d{4}-\\d{2}-\\d{2}$"
      description: Blocked date (YYYY-MM-DD)
    startTime:
      type: string
      format: time
      nullable: true
      example: "09:00"
      pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
      description: Blocked start time (HH:MM). Null together with endTime = whole day blocked.
    endTime:
      type: string
      format: time
      nullable: true
      example: "11:00"
      pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
      description: Blocked end time (HH:MM, exclusive)
    reason:
      type: string
      nullable: true
      example: Maintenance
      description: Optional note explaining why the slot is blocked
    createdAt:
      type: string
      format: date-time
      example: "2026-07-01T10:00:00.000Z"
      description: When the slot was blocked

CreateUnavailableSlotInput:
  type: object
  required:
    - date
  properties:
    date:
      type: string
      format: date
      example: "2026-07-16"
      pattern: "^\\d{4}-\\d{2}-\\d{2}$"
      description: Date to block (YYYY-MM-DD)
    startTime:
      type: string
      format: time
      example: "09:00"
      pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
      description: Blocked start time (HH:MM). Must be provided together with endTime.
    endTime:
      type: string
      format: time
      example: "11:00"
      pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
      description: Blocked end time (HH:MM, must be after startTime). Omit both to block the whole day.
    reason:
      type: string
      maxLength: 300
      example: Maintenance
      description: Optional note explaining why the slot is blocked
  example:
    date: "2026-07-17"
    startTime: "09:00"
    endTime: "11:00"
    reason: Maintenance

BookedTimes:
  type: object
  properties:
    booked:
      type: array
      description: Already-booked appointment slots
      items:
        $ref: "#/components/schemas/BookedSlot"
    blocked:
      type: array
      description: Slots the listing owner has blocked out (no bookings accepted)
      items:
        $ref: "#/components/schemas/UnavailableSlot"
  description: List of already-booked slots for a listing (with date and time)
